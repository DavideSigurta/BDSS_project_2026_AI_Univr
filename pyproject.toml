[project]
name = "bdss-project-2026-ai-univr"
version = "0.1.0"
description = "Post-hoc logical analysis of random forests — BDSS project, first half."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn==1.4.2",
    "numpy<2",
    "scipy<1.14",
    "pandas<2.3",
    "matplotlib",
    "joblib",
    "dd==0.6.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "slow: loads real datasets or runs for a long time",
]
